<style>
:root{--bg:#eeede5;--surface:#fff;--surface2:#f6f5ee;--ink:#1c1d12;--muted:#6f705d;--line:#e0ded0;--accent:#585514;--accent-ink:#fff;--accent-soft:#f0eed2;--danger:#c4381f;

*{box-sizing:border-box}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.brand small{display:block;font:600 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#a9a98d;margin-top:3px}
.cos{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;background:rgba(255,255,255,.07);padding:4px;border-radius:999px}

.tabs{display:flex;gap:4px;overflow-x:auto}

main{max-width:1320px;margin:24px auto 0;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.bench{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:980px){.bench{grid-template-columns:minmax(0,1fr)!important}.sticky{position:static!important}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;box-shadow:var(--sh)}
.card h2{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;display:flex;align-items:center}
.card h2::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px;margin-right:9px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--muted);min-width:0}
input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0;font-weight:500;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn,.pill{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s}
.btn:hover{background:var(--surface2)}.btn:active{transform:translateY(1px)}
.pill{border-radius:999px;padding:6px 14px;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}.btn.pri:hover{filter:brightness(1.12);background:var(--accent)}
.btn.danger{color:var(--danger)}.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}.btn[disabled]{opacity:.55;cursor:wait}
.items{display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:9px;align-items:start;background:var(--bg)}
.item .n{font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:8px;height:26px;width:26px;display:grid;place-items:center;font-size:12px;margin-top:4px}.item .w{grid-column:2/4}
.item .x{border:0;background:none;color:var(--danger);cursor:pointer;font-size:22px;padding:2px;border-radius:6px}.item .x:hover{background:var(--surface)}
.item .am{grid-column:2/4;font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.sums{margin-top:14px;font-variant-numeric:tabular-nums;background:var(--accent-soft);border-radius:11px;padding:10px 14px}.sums div{display:flex;justify-content:space-between;padding:3px 0}
.sums .g{font:800 19px var(--display);border-top:1px dashed var(--line);margin-top:6px;padding-top:9px;color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:12px;z-index:3;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.sticky{position:sticky;top:122px;min-width:0}
.pvwrap{position:relative;width:100%;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 12px 40px rgba(30,30,10,.22),0 0 0 1px var(--line)}
.pvscale{transform-origin:0 0;position:absolute;left:0;top:0}
.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tw{overflow-x:auto}
.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface2)}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.t tr:hover td{background:var(--surface2)}.r{text-align:right!important}
.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input,.toolbar select{width:auto;min-width:150px;flex:1}
.empty{padding:44px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hdr);color:#f1f0e0;padding:11px 20px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.35)}
@media screen{#printarea{display:none}}
@media print{@page{size:A4;margin:0}html,body{background:#fff!important;margin:0!important;padding:0!important}body>*:not(#printarea){display:none!important}#printarea{display:block}
#printarea .sheet{min-height:1120px;max-height:1122px;overflow:hidden}#printarea .sheet,#printarea .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.hostoff{position:fixed;left:-9999px;top:0;width:794px;pointer-events:none}

/* ===== A4 purchase order (always paper-white) ===== */
.sheet{--k:#000;--dk:#111;--ol:#000;--ol2:#8a8a8a;--cr:#f3f3f3;--ln:#cfcfcf;--mu:#444;width:794px;min-height:1123px;background:#fff;color:var(--k);font:12.5px/1.45 'Figtree','Segoe UI',sans-serif;padding:0 44px 30px;display:flex;flex-direction:column}
.sheet *{box-sizing:border-box}
.sheet .band{height:0;margin:0 -44px;border-top:3px solid #000;background:none}
.sheet .hd{display:flex;justify-content:space-between;gap:24px;padding:22px 0 16px;border-bottom:2px solid var(--k)}
.sheet .cn{font:800 25px/1.1 'Bricolage Grotesque','Segoe UI',sans-serif;letter-spacing:-.01em;text-transform:uppercase}

.sheet .pt{text-align:right;flex:none}
.sheet .pt h1{margin:0;font:800 22px/1 'Bricolage Grotesque','Segoe UI',sans-serif;letter-spacing:.18em;color:var(--ol)}
.sheet .mg{display:flex;margin-top:12px;border:1px solid var(--k);border-radius:5px;overflow:hidden;text-align:left}
.sheet .mg div{padding:6px 12px;border-right:1px solid var(--k);min-width:78px}.sheet .mg div:last-child{border-right:0}
.sheet .mg i,.sheet .lb{display:block;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.sheet .mg b{font-size:15px}
.sheet .two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:16px}
.sheet .pn{border:1px solid var(--ln);border-left:4px solid var(--ol2);border-radius:4px;background:var(--cr);padding:10px 14px;min-height:104px}
.sheet .nm{display:block;font-size:14.5px;margin:4px 0 2px}.sheet .tx{font-weight:500}.sheet .gs{margin-top:6px;font-weight:700;font-size:11.5px}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:16px}
.sheet th{background:#fff;color:#000;border-top:2px solid #000;border-bottom:2px solid #000;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:9px 10px;text-align:left}
.sheet th.r,.sheet td.r{text-align:right}.sheet .c{text-align:center}
.sheet td{padding:7px 10px;height:32px;vertical-align:top;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;border-bottom:1px solid var(--ln)}
.sheet tbody tr:nth-child(even) td{background:#f9f9f9}
.sheet td b{font-weight:700}.sheet td .sub{display:block;font-size:11px;color:var(--mu);font-weight:500}
.sheet .fill{flex:1;min-height:14px;border-bottom:1px solid var(--k)}
.sheet .sm{display:grid;grid-template-columns:1fr 290px;gap:20px;margin-top:14px}
.sheet .wd{font-weight:600;padding-top:2px}.sheet .wd .lb{margin-bottom:3px}.sheet .wd .pb{margin-top:14px;font-size:12px;font-weight:500}
.sheet .tt div{display:flex;justify-content:space-between;padding:6px 12px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--ln)}
.sheet .tt .gt{background:#fff;color:#000;font:800 16px 'Bricolage Grotesque','Segoe UI',sans-serif;border:0;border-top:2px solid #000;border-bottom:2px solid #000;padding:10px 12px;border-radius:0}
.sheet .sg{margin-top:18px;min-height:96px;display:flex;justify-content:flex-end;text-align:center}
.sheet .sl{width:240px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:12px}
.sheet .ln{border-top:1.3px solid var(--k);padding-top:5px;font-weight:600;color:var(--mu);font-size:11px;letter-spacing:.04em}
:root{--hdr:#23251a;--hl:#cfc85a}

.mode{display:flex;background:rgba(255,255,255,.08);padding:4px;border-radius:999px;margin-left:6px}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}.tag.nr{background:var(--surface2);color:var(--muted)}

.sheet .law{margin-top:12px;text-align:center;font-size:9.5px;color:var(--mu);line-height:1.45}.sheet .law b{display:block;color:var(--k);font-size:10.5px}

:root{--ok:#1f8a4c;--warn:#b86e00;--bad:#c4381f;--info:#2b6cb0}

const AB={st:{folder:'',perm:'none',busy:false,err:''},timer:0,dirty:false,hide:false,
  conf(){let c={};try{c=JSON.parse(localStorage.getItem('dp.ab')||'{}')}catch(e){}return{on:c.on!==false,dl:c.dl!==false,last:c.last||0,lastFolder:c.lastFolder||0,lastDl:c.lastDl||''}},

  req(store,mode,fn){return AB.db().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))},
  async snaps(){try{return((await AB.req('snaps','readonly',s=>s.getAll()))||[]).sort((a,b)=>b.id-a.id)}catch(e){return[]}},
  async prune(){const all=await AB.snaps(),keep=new Set(),days=new Set();
    all.forEach((r,i)=>{if(i<10)keep.add(r.id);const d=ymd(r.t);if(!days.has(d)&&days.size<30){days.add(d);keep.add(r.id)}});
    const drop=all.filter(r=>!keep.has(r.id));if(drop.length)await AB.req('snaps','readwrite',s=>{drop.forEach(r=>s.delete(r.id))})},
  async snap(reason){const str=JSON.stringify(D),hs=h32(str),all=await AB.snaps();if(all[0]&&all[0].hash===hs)return all[0];
    const t=Date.now(),rec={id:t,t,reason,hash:hs,size:str.length,dcs:Object.keys(D).filter(k=>k.startsWith('dcs/')).length,pos:Object.keys(D).filter(k=>k.startsWith('pos/')).length,data:str};

  async pick(){try{const h=await window.showDirectoryPicker({id:'dcpo-backup',mode:'readwrite'});await AB.req('meta','readwrite',s=>{s.put(h,'dir')});await AB.check();toast('Backup folder set: '+h.name);AB.run('folder set',true)}
    catch(e){if(e&&e.name!=='AbortError')toast('Could not use that folder: '+(e.message||e)+'. Try a new empty folder (not Downloads).')}},

  async toFolder(rec){const h=await AB.dirH();if(!h)return false;if(await h.queryPermission({mode:'readwrite'})!=='granted'){AB.st.perm='prompt';return false}

  bar(){const el=$('#abbar');if(!el)return;const c=AB.conf(),st=AB.st;let h='';
    if(!(S.user&&hasSess())||AB.hide||!isAdmin()){el.innerHTML='';return}

    ${st.err?'<p class="er" style="color:var(--bad);font-weight:600;margin:0 0 10px">⚠ '+esc(st.err)+'</p>':''}
    <p class="muted" style="margin:0 0 12px;font-size:13px">A backup is taken automatically about 20 seconds after every change, when you open the app on a new day, and when you leave the page. Choose a folder (use a new empty one, e.g. <b>DC-PO-Backups</b>, not Downloads) and the app writes one file per day there and keeps the latest 30 days. Put that folder inside Google Drive / OneDrive for off-computer safety.</p>

    ${sn.length?`<div class="tw"><table class="t cp"><thead><tr><th>When</th><th>Reason</th><th class="r">DC</th><th class="r">PO</th><th class="r">Size</th><th></th></tr></thead><tbody>${sn.map(x=>`<tr><td>${fmtDT(x.t)}<div class="muted" style="font-size:11px">${esc(ago(x.t))}</div></td><td>${esc(rs[x.reason]||x.reason)}</td><td class="r">${x.dcs}</td><td class="r">${x.pos}</td><td class="r">${Math.max(1,Math.round(x.size/1024))} KB</td><td style="white-space:nowrap;text-align:right"><button class="btn sm" data-act="abdl" data-id="${x.id}">Download</button> <button class="btn sm" data-act="abrestore" data-id="${x.id}">Restore</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No backups yet</b>The first one is taken automatically within a minute.</div>'}`},
  async restore(id){const sn=(await AB.snaps()).find(x=>x.id===id);if(!sn)return toast('That backup no longer exists.');

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act^="ab"]');if(!b||b.type==='checkbox')return;const a=b.dataset.act,id=+b.dataset.id;if(!isAdmin())return toast('Settings are for admins only.');

async function makePdf(rec,m=S.mode){

  for(const[k,i]of idx.entries()){host.innerHTML=sheet(rec,i,m);const cv=await html2canvas(host.firstElementChild,{scale:2.5,backgroundColor:'#fff',useCORS:true,logging:false});
    let w=210,h=210*cv.height/cv.width;if(h>297){w=w*297/h;h=297}if(k)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',.93),'JPEG',(210-w)/2,0,w,h)}
  host.innerHTML='';return pdf.output('blob')}
function dlFile(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function idleReset(){clearTimeout(idleT);const m=+G('idleMin',0)||0;if(!m||!S.user||!hasSess())return;idleT=setTimeout(()=>{try{sessionStorage.removeItem('dp.sess')}catch(e){}S.sess=false;LG={step:'pick',name:'',err:''};rLogin();toast('Signed out due to inactivity')},m*60000)}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,idleReset,{passive:true}));
render();rLogin();AB.start();idleReset();
</script>
